# Default language-server catalog shipped in the container.
#
# Each entry is tried lazily, per language, only when a file of that type is
# actually analysed. Servers that are not installed are reported as a
# degradation in the bundle manifest (never as a hard failure).
#
# `{root}` is replaced with the workspace root at load time.
servers:
  - language: python
    command: ['pyright-langserver', '--stdio']
    extensions: ['.py', '.pyi']
    init_options:
      python:
        analysis:
          autoSearchPaths: true
          useLibraryCodeForTypes: true
          diagnosticMode: openFilesOnly

  # Lightweight alternative if pyright is unavailable.
  - language: python
    command: ['jedi-language-server']
    extensions: ['.py', '.pyi']

  - language: typescript
    command: ['typescript-language-server', '--stdio']
    extensions: ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs']
    # typescript-language-server needs to resolve a `typescript` installation.
    # Image builds install TypeScript globally, so point tsserver at it; a project
    # that vendors its own TypeScript will override this via its own config.
    init_options:
      typescript:
        tsdk: /usr/lib/node_modules/typescript/lib
    settings:
      typescript:
        tsdk: /usr/lib/node_modules/typescript/lib

  - language: go
    command: ['gopls']
    extensions: ['.go']

  - language: c
    command: ['clangd', '--log=error', '--background-index']
    extensions: ['.c', '.h', '.cc', '.cpp', '.cxx', '.hpp', '.hh']

  - language: rust
    command: ['rust-analyzer']
    extensions: ['.rs']
    # Disabled, and this one stays disabled: the image does not install rust-analyzer. Leaving
    # it enabled would add a "no language server for .rs" degradation per Rust file, which is
    # noise rather than information.
    enabled: false

  - language: java
    command: ['jdtls']
    extensions: ['.java']
    # Enabled as of the jdtls install. It was `false` while the image shipped no Java server,
    # and that flag -- not the missing binary -- was the reason a Java project silently fell
    # back to a heuristic call graph: the catalog entry is what `client_for` consults, so
    # installing the server alone changed nothing.
    init_options:
      # The image has no Maven repository, so jdt.ls cannot resolve dependencies from the
      # network. It still parses the local sources, which is what the call graph is built
      # from; unresolved imports degrade symbol resolution inside those files.
      settings:
        java:
          import:
            maven:
              enabled: false
          configuration:
            updateBuildConfiguration: interactive
          autobuild:
            enabled: false
