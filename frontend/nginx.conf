# nginx for aegis-frontend: serve the built app, and nothing else.
#
# There is deliberately no `proxy_pass` for `/v1` or `/health`. Requests go from the browser
# straight to the gateway whose address `config.js` names, which is what makes this image
# deployable anywhere -- and why the gateway needs CORS origins configured for wherever this
# ends up.
#
# The API base is not in this file either: it is in `/config.js`, written at container start-up.

server {
    listen 8102;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets are content-hashed by Vite, so they can be cached hard. `index.html` names the
    # current hashes and must not be, or a stale copy points at files that no longer exist.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached: it is the file an operator edits to repoint a deployment, and a cached copy
    # would make the change invisible.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes live in the URL hash, so every path under / is the same document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
