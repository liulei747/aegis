[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Aegis - static-scan + LSP call-graph analysis bundle assembler"
readme = "README.md"
requires-python = ">=3.10"
# Core is what every service needs: the contract layer plus settings/logging, and
# the HTTP client a service uses to call another one. A service that needs nothing
# else (scan) installs just this.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # The job queue's client. In core rather than a `queue` extra on purpose: it is a
    # small, pure-Python package, and the failure mode of a forgotten extra is a
    # container that imports fine and then dies on the first submission.
    "redis>=5.0",
]

[project.optional-dependencies]
# service that needs a web server
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# extraction service: the LSP seam, call graph, assembly, packaging
extraction = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# convenience for local development: everything, plus the test tools
all = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # A fake Redis for the queue tests. Not a hand-rolled double: what needs testing
    # *is* Streams semantics (XADD/XREADGROUP/XACK/XAUTOCLAIM and the Lua CAS), so a
    # fake we wrote ourselves would be a test of our own assumptions.
    "fakeredis[lua]>=2.23",
]

[project.scripts]
aegis = "app.cli:main"
# The queue consumer. Same image as the gateway, different entrypoint: the worker is a
# second caller of the extraction code, not a second implementation of it.
aegis-worker = "services.queue.worker:main"

[tool.setuptools.packages.find]
include = ["app*", "aegis_contracts*", "aegis_core*", "services*"]

[tool.setuptools.package-data]
"app.api" = ["static/*.html"]
"services.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: exercises a spawned language server subprocess",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# `demo/repo` is the code under analysis, not our code: it is a small, realistic
# taint chain checked in so `docker compose up` has something to scan. Linting it
# would pressure us to "fix" the fixture until it stops looking like real code (an
# unused import and a deliberately naive SQL concatenation are the point of it).
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # FastAPI's dependency-injection idiom is `x: T = Depends(f)`.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# The fake LSP server is a test double: it mirrors wire shapes, not app style.
"tests/fake_lsp_server.py" = ["B", "UP"]
"tests/*.py" = ["E402"]
