[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Aegis - static-scan + LSP call-graph analysis bundle assembler"
readme = "README.md"
requires-python = ">=3.10"
# Core is what every service needs: the contract layer plus settings/logging, and
# the HTTP client a service uses to call another one. A service that needs nothing
# else (scan) installs just this.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# service that needs a web server
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# extraction service: the LSP seam, call graph, assembly, packaging
extraction = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# convenience for local development: everything, plus the test tools
all = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
aegis = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "aegis_contracts*", "aegis_core*", "services*"]

[tool.setuptools.package-data]
"app.api" = ["static/*.html"]
"services.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: exercises a spawned language server subprocess",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # FastAPI's dependency-injection idiom is `x: T = Depends(f)`.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# The fake LSP server is a test double: it mirrors wire shapes, not app style.
"tests/fake_lsp_server.py" = ["B", "UP"]
"tests/*.py" = ["E402"]
