# nginx for aegis-web: serve the built console, proxy /v1 to the gateway.
#
# Two rules matter here and both are about not leaking reach:
#
# 1. **Nothing but `/v1`, `/health` and the static assets is served.** The console is a
#    renderer; it has no server-side logic to reach, so an unlisted path is a 404 rather than
#    something clever.
# 2. **The gateway is addressed by service name**, so the API needs no published port. The
#    name is resolved per request through Docker's embedded DNS rather than once at start-up:
#    with a plain `proxy_pass http://gateway:8000`, nginx resolves at start-up and **refuses to
#    start at all** if the gateway is absent -- so the console could not serve its page during
#    an API restart, which is exactly when a reader wants it. A `resolver` plus a variable
#    moves that failure to request time, where the page already handles it.

server {
    listen 8102;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Valid inside a compose network; harmless outside one, where the
    # proxy simply cannot resolve and the console reports the API as unreachable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Assets are content-hashed by Vite, so they can be cached hard. `index.html` is not: it
    # names the current asset hashes, and a stale copy points at files that no longer exist.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # A health endpoint for this container, so compose does not have to fetch a page to ask.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API. Same-origin for the browser, so no CORS and no API host in the bundle.
    #
    # The URI has to be appended explicitly. With a literal `proxy_pass http://gateway:8000`
    # nginx passes the original request through and strips the `location` prefix for you -- but
    # the moment the target is a *variable* (which is what makes start-up lazy), that implicit
    # rewrite stops happening and `/v1/jobs` would arrive as `/v1/jobs` on a gateway that also
    # serves `/v1/jobs`... via `/v1/v1/jobs`. Capturing the remainder in `$api_tail` and
    # appending it is the documented form, and `tests/test_web_contract.py` plus the container
    # check in `services/web/README.md` are what caught its absence.
    location /v1/ {
        set $gateway "http://gateway:8000";
        set $api_tail $request_uri;
        proxy_pass $gateway$api_tail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Assembly is the slow path: an unbounded read timeout would hide a hung worker, and a
        # short one would break a legitimately long job. The queue answers 202 quickly; the
        # synchronous path is what needs room.
        proxy_read_timeout 900s;
        proxy_buffering off;
    }

    location = /health {
        set $gateway "http://gateway:8000";
        proxy_pass $gateway/health;
        proxy_set_header Host $host;
    }

    # Client-side routes live in the URL hash, so every path under / is the same document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
